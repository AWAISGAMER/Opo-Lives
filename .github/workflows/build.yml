name: Unzip and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Step 1: Zip extract karke source code clean karna
    - name: Extract Source Code
      run: |
        unzip -o *.zip
        if [ -d "OPOLIVES-main" ]; then
          cd OPOLIVES-main
          if [ -f "OPO_LIVE_Flutter_Starter.zip" ]; then
            unzip -o OPO_LIVE_Flutter_Starter.zip -d ../
          fi
          cd ..
        fi

    # Step 2: Java Setup
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # Step 3: Flutter Setup
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    # Step 4: Flutter pub get
    - name: Get Dependencies
      run: flutter pub get

    # Step 5: Build Release APK
    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    # Step 6: Artifact Upload
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OpoLive-Release-APK
        path: build/app/outputs/flutter-apk/app-release.apk
