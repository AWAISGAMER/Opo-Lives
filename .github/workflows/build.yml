name: Unzip and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Step 1: Subhi ZIP files extract karna aur Flutter root dhoondna
    - name: Extract Source Code
      run: |
        # Main ZIP extraction
        for f in *.zip; do [ -e "$f" ] && unzip -o "$f"; done
        
        # Nested ZIP extraction if present
        find . -name "*.zip" -exec unzip -o {} \;
        
        # Find directory containing pubspec.yaml and move files to root if needed
        PROJECT_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
        echo "Found project at: $PROJECT_DIR"
        
        if [ "$PROJECT_DIR" != "." ]; then
          cp -r $PROJECT_DIR/* .
        fi

    # Step 2: Java 17 Setup
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Step 3: Flutter Setup
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # Step 4: Dependencies Install
    - name: Get Dependencies
      run: flutter pub get

    # Step 5: Build Release APK
    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    # Step 6: Artifact Upload
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OpoLive-Release-APK
        path: build/app/outputs/flutter-apk/app-release.apk
